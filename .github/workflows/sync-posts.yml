name: Sync Notion Posts

on:
  schedule:
    - cron: '0 */8 * * *'  # Runs every 8 hours
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write

# 防止定时任务与手动触发并发运行(并发是 push 冲突的主因)
concurrency:
  group: sync-notion-posts
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉完整历史,pull --rebase 需要

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run sync script
        run: npx tsx script/sync-posts.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 暂存全部改动(脚本生成的 content/images + npm install 可能改的 package-lock.json)
          # 必须 add -A,否则残留未暂存改动会让 pull --rebase 报 "unstaged changes"
          git add -A

          # 无变化则跳过,避免空提交
          git diff --cached --quiet && echo "无内容变化,跳过提交" && exit 0

          git commit -m "chore: sync posts from notion"

          # 用 GITHUB_TOKEN 认证远程
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # 先拉取远程最新,rebase 本地提交(解决 push rejected / fetch first)
          git pull --rebase origin "${GITHUB_REF_NAME}"

          # 推送
          git push origin "HEAD:${GITHUB_REF_NAME}"
