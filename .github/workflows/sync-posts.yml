name: Sync Notion Posts

on:
  schedule:
    - cron: '0 */8 * * *'  # Runs every 8 hours
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write

# 防止定时任务与手动触发并发运行(并发是 push 冲突的主因)
concurrency:
  group: sync-notion-posts
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉完整历史,pull --rebase 需要

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run sync script
        run: npx tsx script/sync-posts.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 暂存全部改动(脚本生成的 content/images + npm install 可能改的 package-lock.json)
          git add -A

          # 无变化则跳过,避免空提交
          git diff --cached --quiet && echo "无内容变化,跳过提交" && exit 0

          git commit -m "chore: sync posts from notion"

          # 用 GITHUB_TOKEN 认证远程
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # 拉取远程最新
          git fetch origin "${GITHUB_REF_NAME}"

          # 合并远程改动:
          # 内容文件(content/posts、public/images/posts)每次 sync 都全量重建,uuid 文件名全变,
          # rebase/普通 merge 必然冲突。用 -X ours:冲突时一律以本地(新生成内容)为准;
          # 代码文件(脚本/workflow/配置)若只有远程改动,则正常合并保留。
          git merge -X ours --no-edit "origin/${GITHUB_REF_NAME}"

          # 推送
          git push origin "HEAD:${GITHUB_REF_NAME}"
